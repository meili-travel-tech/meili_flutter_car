name: Publish to Pub.dev

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: 'meili_flutter_car version to publish (e.g. 0.8.0 or v0.8.0)'
                required: true
                type: string
            release_notes:
                description: 'Release notes for the version'
                required: true
                type: string

concurrency:
    group: publish-pub-dev
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main
                  fetch-depth: 0

            # Only the app-facing meili_flutter_car version is driven by this workflow's input.
            # meili_flutter_car_ios, meili_flutter_car_android and
            # meili_flutter_car_platform_interface version independently — each is bumped in its
            # own pubspec.yaml by the PR that changes it, and this workflow publishes whatever
            # version is already committed there.
            - name: Get version and release info
              id: release_info
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    VERSION="${{ github.event.inputs.version }}"
                    VERSION="${VERSION#v}"
                    echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
                    echo "${{ github.event.inputs.release_notes }}" >> $GITHUB_ENV
                    echo "EOF" >> $GITHUB_ENV
                  else
                    TAG="${{ github.event.release.tag_name }}"
                    VERSION="${TAG#v}"
                    echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
                    gh release view "$TAG" --json body -q .body >> $GITHUB_ENV
                    echo "EOF" >> $GITHUB_ENV
                  fi

                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
                    echo "Invalid VERSION: $VERSION"
                    exit 1
                  fi

                  echo "VERSION=$VERSION" >> $GITHUB_ENV
                  echo "Publishing meili_flutter_car=$VERSION"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Update CHANGELOG.md
              run: |
                  changelog=meili_flutter_car/CHANGELOG.md
                  touch "$changelog"
                  echo -e "## $VERSION ($(date +%Y-%m-%d))\n\n$RELEASE_BODY\n\n$(cat "$changelog")" > "$changelog"

            - name: Update version in pubspec.yaml
              run: |
                  export VERSION
                  yq -i '.version = env(VERSION)' meili_flutter_car/pubspec.yaml

            - name: Update README versions
              run: |
                  semver='[0-9]+\.[0-9]+\.[0-9]+(-[^[:space:]]+)?'
                  update_readme() {
                    local file="$1"
                    [ -f "$file" ] || return 0
                    sed -i -E "s#(meili_flutter_car: \^?)${semver}#\1${VERSION}#" "$file"
                  }
                  update_readme README.md
                  update_readme meili_flutter_car/README.md

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: '3.x'
                  channel: 'stable'

            - name: Install dependencies
              run: |
                  # Sibling packages may not be on pub.dev yet (always true for the very first
                  # release of a renamed package) — resolve locally for verify. Each override file
                  # is removed right before that specific package is published, since `dart pub
                  # publish` refuses to run with an active dependency_overrides.
                  {
                    echo 'dependency_overrides:'
                    echo '  meili_flutter_car_platform_interface:'
                    echo '    path: ../meili_flutter_car_platform_interface'
                  } > meili_flutter_car_ios/pubspec_overrides.yaml
                  cp meili_flutter_car_ios/pubspec_overrides.yaml meili_flutter_car_android/pubspec_overrides.yaml

                  {
                    echo 'dependency_overrides:'
                    echo '  meili_flutter_car_android:'
                    echo '    path: ../meili_flutter_car_android'
                    echo '  meili_flutter_car_ios:'
                    echo '    path: ../meili_flutter_car_ios'
                    echo '  meili_flutter_car_platform_interface:'
                    echo '    path: ../meili_flutter_car_platform_interface'
                  } > meili_flutter_car/pubspec_overrides.yaml

                  for pkg in meili_flutter_car_platform_interface meili_flutter_car_android meili_flutter_car_ios meili_flutter_car; do
                    echo "flutter pub get in $pkg"
                    (cd "$pkg" && flutter pub get)
                  done

            - name: Verify package
              run: |
                  for pkg in meili_flutter_car_platform_interface meili_flutter_car_android meili_flutter_car_ios meili_flutter_car; do
                    echo "flutter analyze in $pkg"
                    (cd "$pkg" && flutter analyze --no-fatal-infos)
                  done

                  for pkg in meili_flutter_car_platform_interface meili_flutter_car; do
                    echo "flutter test in $pkg"
                    (cd "$pkg" && flutter test)
                  done

                  dart format --set-exit-if-changed \
                    meili_flutter_car_platform_interface \
                    meili_flutter_car_android \
                    meili_flutter_car_ios \
                    meili_flutter_car

            - name: Setup Pub Credentials
              env:
                  PUB_DEV_PUBLISH_ACCESS_TOKEN: ${{ secrets.PUB_DEV_PUBLISH_ACCESS_TOKEN }}
                  PUB_DEV_PUBLISH_REFRESH_TOKEN: ${{ secrets.PUB_DEV_PUBLISH_REFRESH_TOKEN }}
                  PUB_DEV_PUBLISH_TOKEN_ENDPOINT: ${{ secrets.PUB_DEV_PUBLISH_TOKEN_ENDPOINT }}
                  PUB_DEV_PUBLISH_EXPIRATION: ${{ secrets.PUB_DEV_PUBLISH_EXPIRATION }}
              run: |
                  mkdir -p ~/.config/dart
                  cat << EOF > ~/.config/dart/pub-credentials.json
                  {
                    "accessToken": "$PUB_DEV_PUBLISH_ACCESS_TOKEN",
                    "refreshToken": "$PUB_DEV_PUBLISH_REFRESH_TOKEN",
                    "tokenEndpoint": "$PUB_DEV_PUBLISH_TOKEN_ENDPOINT",
                    "scopes": ["openid","https://www.googleapis.com/auth/userinfo.email"],
                    "expiration": $PUB_DEV_PUBLISH_EXPIRATION
                  }
                  EOF

            - name: Publish to pub.dev
              run: |
                  is_on_pub_dev() {
                    local name="$1"
                    local version="$2"
                    curl -sf "https://pub.dev/api/packages/${name}/versions/${version}" >/dev/null
                  }

                  publish_if_needed() {
                    local dir="$1"
                    local name version
                    # dart pub publish refuses to run with an active dependency_overrides.
                    rm -f "$dir/pubspec_overrides.yaml"
                    name=$(yq -r '.name' "$dir/pubspec.yaml")
                    version=$(yq -r '.version' "$dir/pubspec.yaml")

                    echo "Checking pub.dev for ${name}@${version}..."
                    if is_on_pub_dev "$name" "$version"; then
                      echo "Skipping ${name}@${version} — already on pub.dev"
                      return 0
                    fi

                    echo "Publishing ${name}@${version} from ${dir}"
                    set +e
                    timeout 600 bash -c "cd '$dir' && dart pub publish --force" 2>&1 | tee "/tmp/publish-${name}.log"
                    local status=${PIPESTATUS[0]}
                    set -e

                    if [ "$status" -eq 124 ]; then
                      echo "Publish timed out after 10 minutes for ${name}"
                      return 1
                    fi
                    if [ "$status" -eq 0 ]; then
                      return 0
                    fi
                    if grep -qiE 'already exists|duplicate|was previously published' "/tmp/publish-${name}.log"; then
                      echo "Skipping ${name}@${version} — version already on pub.dev"
                      return 0
                    fi
                    return "$status"
                  }

                  # Platform packages first so meili_flutter_car can resolve them from pub.dev.
                  # Each bumps its own pubspec.yaml manually when its API or native pin changes.
                  if [ -d meili_flutter_car_platform_interface ]; then publish_if_needed meili_flutter_car_platform_interface; fi
                  if [ -d meili_flutter_car_android ]; then publish_if_needed meili_flutter_car_android; fi
                  if [ -d meili_flutter_car_ios ]; then publish_if_needed meili_flutter_car_ios; fi

                  for attempt in 1 2 3 4 5 6; do
                    echo "flutter pub get in meili_flutter_car (pub.dev resolution, attempt $attempt)"
                    if (cd meili_flutter_car && flutter pub get); then
                      break
                    fi
                    if [ "$attempt" -eq 6 ]; then
                      echo "Dependency resolution failed after waiting for pub.dev indexing"
                      exit 1
                    fi
                    echo "Waiting 30s for pub.dev to index platform packages..."
                    sleep 30
                  done

                  publish_if_needed meili_flutter_car

            - name: Commit updates
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add meili_flutter_car/CHANGELOG.md meili_flutter_car/pubspec.yaml README.md meili_flutter_car/README.md
                  git commit -m "MPD-0: release version $VERSION" || echo "No changes to commit"
                  git pull --rebase origin main
                  git push origin main
