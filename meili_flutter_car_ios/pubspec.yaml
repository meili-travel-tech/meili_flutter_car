name: meili_flutter_car_ios
description: iOS implementation of the meili_flutter_car plugin
version: 0.5.0

homepage: https://github.com/meili-travel-tech/meili_flutter_car

environment:
    sdk: '>=3.4.0 <4.0.0'
    flutter: '>=1.20.0'

flutter:
    plugin:
        implements: meili_flutter_car
        platforms:
            ios:
                pluginClass: MeiliFlutterPlugin

dependencies:
    flutter:
        sdk: flutter
    meili_flutter_car_platform_interface: ^0.5.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    plugin_platform_interface: ^2.1.8
    very_good_analysis: ^6.0.0
